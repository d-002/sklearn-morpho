# Production

[project]
name = "sklearn-morpho"
description = "Scikit-learn classifiers toolbox for morphological perceptrons"
version = "0.2.4"
requires-python = ">=3.11"
dependencies = [
    "cvxpy>=1.9.2",
    "numpy>=2.4.6",
    "scikit-learn>=1.9.0",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
readme = "README-PyPI.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dccp = [
    "dccp>=1.1.1,<2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Dependency groups

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3", # for coding the MREs
    "matplotlib>=3.11.1", # for files in testing
    "pandas>=3.0.5", # for scikit-learn's check_estimator and datasets
    "pyqt6>=6.11.0", # for matplotlib display on some devices
]
mypy = [
    "matplotlib>=3.11.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "scipy-stubs>=1.17.1.5",
]
pdoc = [
    "pdoc>=16.0.0",
]
test = [
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]

# Pyright

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
stubPath = "typings"

# Ruff

[tool.ruff]
indent-width = 4
line-length = 80

[tool.ruff.lint]
select = ["E", "I", "ANN"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

# Mypy

[tool.mypy]
strict = true
disallow_subclassing_any = false
warn_unused_ignores = false
mypy_path = "typings"

[[tool.mypy.overrides]]
module = ["sklearn.*", "cvxpy.*", "dccp.*", "joblib.*"]
follow_imports = "skip"
ignore_missing_imports = true
