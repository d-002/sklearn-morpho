name: Reusable testsuite

on:
  workflow_call:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest" ]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # also test on other OSes, but not for all versions to save minutes
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: pip install -U pip hatch mypy

      - name: Run tests with Hatch
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            hatch run test.py${{ matrix.python-version }}:pytest -n 5
          else
            hatch run pytest -n 5
          fi
