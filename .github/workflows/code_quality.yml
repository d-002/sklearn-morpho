name: Code quality

on:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: "code quality"
  cancel-in-progress: true

jobs:
  todo:
    name: Check for TODOs in code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan for TODOs in the code
        run: ./check_todos.sh

  types:
    name: Check for typing errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python with uv
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dccp --group test

      - name: Run mypy
        run: uv run mypy src tests testing

  lint:
    name: Check for ${{ matrix.name }} errors
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "generic linting"
            command: "ruff format --check ."
          - name: "coding style"
            command: "ruff check ."

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python with uv
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dccp --group ruff

      - name: Run linter for ${{ matrix.name }} errors
        run: uv run ${{ matrix.command }}
