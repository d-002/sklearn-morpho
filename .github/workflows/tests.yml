name: Testsuite

on:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: "testsuite"
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/reusable_tests.yml

  coverage:
    name: Coverage test (ignore failed tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Set up Python with uv
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra dccp --group test

      - name: Check coverage
        run: |
          uv run pytest -n 5 --cov --cov-fail-under=90
